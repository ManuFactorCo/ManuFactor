<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ManuFactor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- stylesheet is just an example for now, styles.css doesnt exist in Increment 2 -->
</head>
<body>
    <!-- SECURITY LEVELS --> <!-- LD changing all instance of varibale "security_level" to "security" to match app-->
    {% if security == 3 %}
        <!-- ADMIN -->
        <a href="add_users.html"><button>Manage Users</button></a>
        <a href="list_users.html"><button>View Users</button></a>
        <a href="add_data.html"><button>Manage Data</button></a>
        <a href="list_data.html"><button>View Data</button></a>
    {% elif security == 2 %}
        <!-- USER -->
        <a href="add_data.html"><button>Manage Data</button></a>
        <a href="list_data.html"><button>View Data</button></a>
    {% elif security == 1 %}
        <!-- VIEWER -->
        <a href="list_data.html"><button>View Data</button></a>
    {% endif %}
    
    <!-- LOGOUT -->
    <br><br>
    <a href="/logout">Logout</a>
</body>
</html>
