<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Team - ManuFactor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="user-list-container">
        <h1>View and Manage Team</h1>
        <h2>Members</h2>
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>
                        {% if user.security == 3 %}
                            Admin
                        {% elif user.security == 2 %}
                            User
                        {% elif user.security == 1 %}
                            Viewer
                        {% else %}
                            Unknown
                        {% endif %}
                    </td>
                    <td>
                        <a href="{{ url_for('edit_user', user_id=user.id) }}">
                            <button>Edit</button>
                        </a>
                        <a href="{{ url_for('delete_user', user_id=user.id) }}">
                            <button>Delete</button>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('add_user') }}">
            <button>Add New User</button>
        </a>
    </div>
    <a href="{{ url_for('home') }}">
        <button>Back to Dashboard</button>
    </a>

    <!-- LOGOUT -->
    <br><br>
    <a href="/logout">Logout</a>
</body>
</html>
