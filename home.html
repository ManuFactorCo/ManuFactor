<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ManuFactor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homeStyle.css') }}">
    
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>

    <form>
    <!-- SECURITY LEVELS -->
    {% if security == 3 %}
        <!-- ADMIN -->
        <a href="{{ url_for('add_user') }}"><button>Manage Users</button></a>
        <a href="{{ url_for('list_users') }}"><button>View Users</button></a>
        <a href="{{ url_for('add_data') }}"><button>Manage Data</button></a>
        <a href="{{ url_for('list_data') }}"><button>View Data</button></a>
    {% elif security == 2 %}
        <!-- USER -->
        <a href="{{ url_for('add_data') }}"><button>Manage Data</button></a>
        <a href="{{ url_for('list_data') }}"><button>View Data</button></a>
    {% elif security == 1 %}
        <!-- VIEWER -->
        <a href="{{ url_for('list_data') }}"><button>View Data</button></a>
    {% endif %}
    </form>
    
    <!-- LOGOUT -->
    <br><br>
    <a href="/logout">Logout</a>
</body>
</html>
